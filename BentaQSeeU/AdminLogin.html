<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Login — Benta Q, See U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <script src="admin.js" defer></script>
</head>

<body>
  <main class="login-shell">
    <form class="login-card" id="login-form" novalidate>
      <a href="index.html" class="login-logo" aria-label="Back to marketplace">
        <img src="OurLogo.png" alt="" />
      </a>

      <h1 class="login-title">Welcome back, Admin!</h1>
      <p class="login-sub">Sign in to access your dashboard and manage system settings.</p>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input id="email" name="email" type="email" autocomplete="username" required
            placeholder="you@bentaqseeu.com" />
          <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required
            placeholder="••••••••" />
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <a href="#" class="forgot-link">Forgot password?</a>

      <p class="form-error" id="login-error" role="alert" hidden></p>

      <button type="submit" class="signin-btn" id="signin-btn">
        <span class="btn-label">Sign In</span>
        <span class="btn-spinner" aria-hidden="true" hidden></span>
      </button>

      <p class="demo-hint">
        Demo credentials: <code>admin@bentaqseeu.com</code> / <code>bentaq2026</code>
      </p>
    </form>
  </main>
</body>

</html>
