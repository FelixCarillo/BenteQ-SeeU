<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Manager — Benta Q, See U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="admin-inventory.css" />
  <script src="listings.js" defer></script>
  <script src="admin.js" defer></script>
  <script src="admin-db.js" defer></script>
  <script src="AdminDashboard.js" defer></script>
</head>

<body>
  <main class="inv-shell">
    <header class="inv-header">
      <div class="inv-brand">
        <img src="OurLogo.png" alt="" class="inv-logo" />
        <div>
          <span class="inv-brand-name">Benta Q, See U</span>
          <span class="inv-brand-tag">Admin Inventory</span>
        </div>
      </div>
      <div class="inv-header-actions">
        <a href="index.html" class="inv-link-btn">View marketplace ↗</a>
        <button type="button" class="inv-ghost-btn" id="reset-btn">Reset</button>
        <button type="button" class="inv-ghost-btn" id="logout-btn">Sign out</button>
      </div>
    </header>

    <section class="inv-title-row">
      <div>
        <h1>Product Post Management</h1>
        <p>View, edit, and manage product listings in one place.</p>
      </div>
      <button type="button" class="inv-primary-btn" id="add-listing-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add Listing
      </button>
    </section>

    <section class="inv-toolbar">
      <div class="inv-search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input type="search" id="inv-search" placeholder="Search by name, seller, category…" aria-label="Search listings" />
      </div>
      <div class="inv-toolbar-right">
        <button type="button" class="inv-ghost-btn" id="select-all-btn">Select all</button>
        <button type="button" class="inv-danger-btn" id="delete-selected-btn" hidden disabled>
          Delete selected (<span id="selected-count">0</span>)
        </button>
      </div>
    </section>

    <div class="inv-table-wrap">
      <table class="inv-table" id="inv-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="select-all-checkbox" aria-label="Select all" /></th>
            <th class="col-thumb">Image</th>
            <th class="col-name">Product</th>
            <th class="col-seller">Seller</th>
            <th class="col-date">Date</th>
            <th class="col-views">Views</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="inv-tbody"></tbody>
      </table>
      <div class="inv-empty" id="inv-empty" hidden>
        <p class="inv-empty-title">No listings found</p>
        <p class="inv-empty-sub">Try a different search, or add your first listing.</p>
      </div>
    </div>
  </main>

  <!-- Image preview modal -->
  <div class="modal-overlay" id="image-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="image-modal-title">
      <header class="modal-header">
        <h2 id="image-modal-title">Product images</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Close">✕</button>
      </header>
      <div class="modal-body image-gallery" id="image-gallery"></div>
    </div>
  </div>

  <!-- Details modal -->
  <div class="modal-overlay" id="details-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="details-modal-title">
      <header class="modal-header">
        <h2 id="details-modal-title">Product details</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Close">✕</button>
      </header>
      <div class="modal-body" id="details-body"></div>
      <footer class="modal-footer" id="details-footer"></footer>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="confirm-modal" hidden>
    <div class="modal-card modal-card-sm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <header class="modal-header">
        <h2 id="confirm-title">Confirm delete</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <p id="confirm-message" style="margin:0;line-height:1.5;color:#4E2304;"></p>
      </div>
      <footer class="modal-footer">
        <button type="button" class="inv-ghost-btn" data-close-modal>Cancel</button>
        <button type="button" class="inv-danger-btn" id="confirm-delete-btn">Delete</button>
      </footer>
    </div>
  </div>
</body>

</html>
